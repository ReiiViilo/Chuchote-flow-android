name: "Build APK"

# Compile l'APK debug de Chuchote Flow Android à chaque push sur main et
# sur demande. L'APK est signé avec la clé debug du runner : lors d'une mise
# à jour, Android peut exiger de désinstaller la version précédente
# (signatures différentes d'un build à l'autre).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (avec whisper.cpp)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chuchote-flow-android-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
